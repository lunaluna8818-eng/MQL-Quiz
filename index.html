<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiraLuna: Game Edukasi Imut 🌸</title>
    <style>
        :root {
            --primary-pink: #ff6584;
            --light-pink: #ffe4e1;
            --soft-bg: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            --card-bg: #ffffff;
            --text-color: #555555;
            --button-hover: #ff476f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--soft-bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow: hidden;
            position: relative;
        }

        .game-container {
            background: var(--card-bg);
            padding: 25px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 101, 132, 0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 4px solid #fff;
            box-sizing: border-box;
            z-index: 2;
        }

        h1 {
            color: var(--primary-pink);
            margin-bottom: 8px;
            font-size: 20px;
        }

        p.subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn-menu {
            width: 100%;
            background-color: #fff;
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-menu:hover {
            background-color: var(--primary-pink);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 101, 132, 0.4);
        }

        .btn-back {
            background-color: #f1f3f5;
            color: #868e96;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #e9ecef;
            color: #495057;
        }

        .btn-restart, .btn-option, .btn-hint {
            width: 100%;
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .btn-restart:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 101, 132, 0.4);
        }

        .top-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #ff476f;
            background: #fff0f3;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .timer-box {
            background: #ff476f;
            color: white;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 12px;
        }

        .question-box {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            background: var(--light-pink);
            padding: 15px;
            border-radius: 15px;
            color: #d6336c;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-option {
            background-color: #fff;
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            text-align: left;
            padding: 11px 15px;
            font-size: 14px;
        }

        .btn-option:hover:not(:disabled) {
            background-color: var(--primary-pink);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 101, 132, 0.4);
        }

        .btn-hint {
            background-color: #ffd43b;
            color: #e67700;
            font-size: 13px;
            padding: 8px;
            margin-bottom: 10px;
            border: 2px dashed #f59f00;
        }

        .btn-hint:hover:not(:disabled) {
            background-color: #fcc419;
            transform: translateY(-1px);
        }

        .btn-hint:disabled {
            background-color: #f1f3f5;
            color: #adb5bd;
            border-color: #dee2e6;
            cursor: not-allowed;
        }

        .page { display: none; }
        .page.active { display: block; }

        .feedback {
            font-weight: bold;
            font-size: 13px;
            min-height: 18px;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .floating-star {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container" id="main-card">
        
        <!-- HALAMAN 1: PILIH MODE -->
        <div id="page-mode" class="page active">
            <h1>🌸 MiraLuna: Game Edukasi 🌸</h1>

        </div>

            <p class="subtitle">Sesuaikan dengan tingkat pendidikanmu</p>

            </div>
            <button class="btn-back" onclick="playSound('click'); goToPage('page-mode')">⬅️ Kembali</button>
        </div>

        <!-- HALAMAN 3: PILIH MATA PELAJARAN -->
        <div id="page-subject" class="page">
            <h1>📚 Pilih Mata Pelajaran</h1>
            <p class="subtitle">Apa pelajaran favoritmu hari ini?</p>
            <div class="menu-grid">

            </div>
            <button class="btn-back" onclick="playSound('click'); goToPage('page-level')">⬅️ Kembali</button>
        </div>

    <script>
        // --- SISTEM AUDIO OTOMATIS ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.25);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        // --- ANIMASI BINTANG MELAYANG ---
        function spawnFloatingStars(event) {
            let x = event ? event.clientX : window.innerWidth / 2;
            let y = event ? event.clientY : window.innerHeight / 2;

            for (let i = 0; i < 5; i++) {
                let star = document.createElement('div');
                star.className = 'floating-star';
                star.textContent = i % 2 === 0 ? '⭐' : '🌟';
                
                let offsetX = (Math.random() - 0.5) * 100;
                let offsetY = (Math.random() - 0.5) * 50;
                
                star.style.left = (x + offsetX) + 'px';
                star.style.top = (y + offsetY) + 'px';
                
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1200);
            }
        }

        // State Game
        let currentMode = 'solo';
        let currentLevel = 'sd';
        let currentSubject = 'matematika';
        let activePlayer = 'p1';
        let currentQuestionIndex = 0;
        let scoreP1 = 0;
        let scoreP2 = 0;
        let hintAvailable = true;
        let timer = null;
        let timeLeft = 15;
        let activeQuestions = [];

        function goToPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function selectMode(mode) {
            currentMode = mode;
            goToPage('page-level');
        }

        function selectLevel(level) {
            currentLevel = level;
            goToPage('page-subject');
        }

        function selectSubject(subject) {
            currentSubject = subject;
            startQuizGame();
        }

        function startQuizGame() {
            activePlayer = 'p1';
            currentQuestionIndex = 0;
            scoreP1 = 0;
            scoreP2 = 0;
            hintAvailable = true;

            let subObj = databaseSoal[currentSubject][currentLevel];
            // Mengambil 20 soal secara acak (shuffle) dari pool 20 soal yang tersedia
            let shuffledPool = [...subObj].sort(() => Math.random() - 0.5);
            
            let poolP1 = shuffledPool.slice(0, 20);
            let poolP2 = currentMode === 'duo' ? [...subObj].sort(() => Math.random() - 0.5).slice(0, 20) : [];
            
            activeQuestions = { p1: poolP1, p2: poolP2 };
            goToPage('page-quiz');
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('time-left').textContent = timeLeft;

            let qList = activeQuestions[activePlayer];
            if (currentQuestionIndex >= qList.length) {
                endGame();
                return;
            }

            let currentQ = qList[currentQuestionIndex];
            
            let titleStr = currentMode === 'duo' ? `🌸 Kuis (Giliran Player ${activePlayer === 'p1' ? '1' : '2'}) 🌸` : `🌸 Kuis Desa Pelangi 🌸`;
            document.getElementById('quiz-title').textContent = titleStr;
            document.getElementById('info-left').textContent = `Soal ${currentQuestionIndex + 1}/${qList.length}`;
            document.getElementById('info-right').textContent = `Skor: ${activePlayer === 'p1' ? scoreP1 : scoreP2}`;
            document.getElementById('question-text').textContent = currentQ.q;
            document.getElementById('feedback').textContent = '';

            let hintBtn = document.getElementById('btn-hint');
            hintBtn.disabled = !hintAvailable;
            document.getElementById('hint-count').textContent = hintAvailable ? '1' : '0';

            let shuffledOptions = [...currentQ.options].sort(() => Math.random() - 0.5);
            let optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            shuffledOptions.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.textContent = opt;
                btn.onclick = (e) => checkAnswer(opt, currentQ.a, e);
                optContainer.appendChild(btn);
            });

            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    checkAnswer('', currentQ.a, null);
                }
            }, 1000);
        }

        function checkAnswer(selected, correct, event) {
            clearInterval(timer);
            let feedback = document.getElementById('feedback');
            let buttons = document.querySelectorAll('.options-container button');
            buttons.forEach(b => b.disabled = true);

            if (selected === correct) {
                playSound('correct');
                feedback.style.color = '#2b8a3e';
                feedback.textContent = "Hore, Jawaban Benar! ⭐";
                spawnFloatingStars(event);

                if (activePlayer === 'p1') scoreP1 += 10;
                else scoreP2 += 10;
            } else {
                playSound('wrong');
                feedback.style.color = '#c92a2a';
                feedback.textContent = selected === '' ? "Waktu Habis! ⏱️" : `Kurang tepat. Jawaban yang benar: ${correct}`;
                document.getElementById('main-card').classList.add('shake');
                setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 400);
            }

            setTimeout(() => {
                if (currentMode === 'duo') {
                    activePlayer = activePlayer === 'p1' ? 'p2' : 'p1';
                    if (activePlayer === 'p1') currentQuestionIndex++;
                } else {
                    currentQuestionIndex++;
                }
                loadQuestion();
            }, 1500);
        }

        function useHint() {
            if (!hintAvailable) return;
            hintAvailable = false;
            document.getElementById('btn-hint').disabled = true;
            document.getElementById('hint-count').textContent = '0';

            let qList = activeQuestions[activePlayer];
            let currentQ = qList[currentQuestionIndex];
            let buttons = document.querySelectorAll('.options-container button');
            
            let removedCount = 0;
            buttons.forEach(b => {
                if (b.textContent !== currentQ.a && removedCount < 2) {
                    b.disabled = true;
                    b.style.opacity = '0.3';
                    removedCount++;
                }
            });
        }

        function endGame() {
            goToPage('page-result');
            let scoreText = document.getElementById('final-score-text');
            let highScoreText = document.getElementById('high-score-text');
            let congrats = document.getElementById('congrats-message');

            if (currentMode === 'solo') {
                scoreText.textContent = `Skor Akhir Kamu: ${scoreP1} Poin! 🌟`;

                // Logika LocalStorage untuk High Score Solo
                let storageKey = `miraluna_highscore_${currentLevel}_${currentSubject}`;
                let savedHighScore = localStorage.getItem(storageKey) ? parseInt(localStorage.getItem(storageKey)) : 0;

                if (scoreP1 > savedHighScore) {
                    localStorage.setItem(storageKey, scoreP1);
                    highScoreText.textContent = `🏆 REKOR BARU (High Score): ${scoreP1} Poin! 🎉`;
                } else {
                    highScoreText.textContent = `🏆 Rekor Tertinggi Kamu: ${savedHighScore} Poin`;
                }

                congrats.textContent = scoreP1 >= 140 ? "Luar biasa! Kamu sangat pintar dan teliti! 👑🌸" : "Hebat! Terus semangat belajar ya! 💪✨";
            } else {
                scoreText.textContent = `Skor Akhir — Player 1: ${scoreP1} | Player 2: ${scoreP2}`;
                highScoreText.textContent = ""; 
                if (scoreP1 > scoreP2) congrats.textContent = "🎉 Pemenang: Player 1! Hebat sekali! 🏆";
                else if (scoreP2 > scoreP1) congrats.textContent = "🎉 Pemenang: Player 2! Luar biasa! 🏆";
                else congrats.textContent = "Wah, hasil seri! Kalian berdua sama-sama pintar! 🤝💖";
            }
        }
